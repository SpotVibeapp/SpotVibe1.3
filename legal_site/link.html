<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpotVibe — Open in the app</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f4fb; color: #1c1630; }
    header { background: linear-gradient(135deg, #6C5CE7, #a29bfe); color: #fff; padding: 40px 20px; text-align: center; }
    header h1 { margin: 0 0 6px; font-size: 28px; }
    header p { margin: 0; opacity: .9; }
    main { max-width: 460px; margin: 28px auto; padding: 0 20px 64px; text-align: center; }
    .btn { display: block; border-radius: 16px; padding: 18px; margin-bottom: 12px; text-decoration: none; font-weight: 600; box-shadow: 0 8px 24px rgba(108,92,231,.12); }
    .btn.primary { background: #6C5CE7; color: #fff; }
    .btn.light { background: #fff; color: #1c1630; }
    .btn.subtle { background: transparent; color: #6C5CE7; box-shadow: none; font-weight: 500; }
    #status { margin-top: 16px; font-size: 14px; color: #6b6580; min-height: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>🎶 SpotVibe</h1>
    <p>Find out what's happening near you</p>
  </header>
  <main>
    <a id="openBtn" class="btn primary" href="#">Open in the SpotVibe app</a>
    <a class="btn light" href="https://play.google.com/store/apps/details?id=app.spotvibe">Get SpotVibe on Google Play</a>
    <a class="btn subtle" href="/">Continue to the website</a>
    <p id="status"></p>
  </main>
  <script>
    (function () {
      // /event/{id} or /user-event/{id}  →  spotvibe://event/{id}
      var m = window.location.pathname.match(/^\/(event|user-event)\/([^\/]+)/);
      var deep = m
        ? 'spotvibe://' + m[1] + '/' + encodeURIComponent(m[2])
        : 'spotvibe://';

      var btn = document.getElementById('openBtn');
      btn.href = deep;

      // Let link preview crawlers (iMessage, WhatsApp, Slack…) see the page
      // without triggering a redirect.
      if (/bot|crawl|facebookexternalhit|twitterbot|slack|whatsapp|preview/i.test(navigator.userAgent)) {
        return;
      }

      // Auto-attempt once. Chrome may block un-gestured custom-scheme
      // navigation — that's fine, the button covers it.
      var status = document.getElementById('status');
      setTimeout(function () {
        if (document.visibilityState === 'visible') {
          status.textContent = 'Tap “Open in the SpotVibe app” if nothing happened…';
          window.location.href = deep;
        }
      }, 900);
    })();
  </script>
</body>
</html>
