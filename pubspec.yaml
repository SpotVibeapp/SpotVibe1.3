name: spotvibe_app
description: SpotVibe — local events discovery app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Core packages (fully cross-platform)
  cupertino_icons: ^1.0.6
  dio: ^5.8.0
  provider: ^6.1.1

  # OS integration / UX helpers
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.4
  awesome_notifications: ^0.10.1
  wakelock_plus: ^1.3.2
  path: ^1.9.1
  
  # State management (cross-platform) — using provider; flutter_bloc/equatable
  # were declared but never used, so they were removed.
  async: ^2.13.0
    
  # Data persistence (cross-platform)
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # Remote database and networking
  http: ^1.4.0

  # Navigation (fully cross-platform)
  go_router: ^14.1.4

  # ─── Media (images / video / audio) ───
  image: ^4.5.4
  video_player: ^2.10.0

  # UI utilities (fully cross-platform)
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.2
  flex_color_scheme: ^8.2.0
  flutter_hooks: ^0.20.5
  loading_animation_widget: ^1.2.1
  flutter_staggered_grid_view: ^0.7.0
  animations: ^2.0.11
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.71.0
  shimmer_animation: ^2.2.2
  responsive_framework: ^1.5.1
  table_calendar: ^3.2.0
  carousel_slider: ^5.1.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  vector_math: ^2.1.4
  http_parser: ^4.1.2
  crypto: ^3.0.6
  mime: ^2.0.0
  archive: ^4.0.7
  package_info_plus: ^8.3.1

  # Dependency Injection (stable cross-platform)
  get_it: ^7.6.7

  # --- PRIMIO_ADDITIONS BEGIN (do not edit/remove) ---
  # PRIMIO_ADDED: image_picker — pick images and videos from camera/gallery on Android, iOS, and Web
  image_picker: ^1.1.2
  # PRIMIO_ADDED: file_picker — cross-platform file picker with real web support (browser native file input); used for picking images and videos on web where image_picker has no implementation
  file_picker: ^8.0.0
  # PRIMIO_ADDED: flutter_map — open-source OpenStreetMap tile renderer (no API key)
  flutter_map: ^7.0.2
  # PRIMIO_ADDED: flutter_map_marker_cluster — groups nearby map markers into count bubbles
  flutter_map_marker_cluster: ^1.4.0
  # PRIMIO_ADDED: latlong2 — LatLng coordinate type required by flutter_map
  latlong2: ^0.9.1
  # PRIMIO_ADDED: flutter_branch_sdk — Branch.io deferred deep linking; delivers the original link after a fresh install
  flutter_branch_sdk: ^6.7.0
  # PRIMIO_ADDED: add_2_calendar — open native calendar (Apple on iOS, Google on Android) to add pre-filled event
  add_2_calendar: ^3.0.1
  # PRIMIO_ADDED: app_links — listen for incoming deep link URIs while the app is running (foreground + background cold-start)
  app_links: ^6.3.4
  # PRIMIO_ADDED: share_plus — native OS share sheet for exporting story card images to Instagram and other apps
  share_plus: ^10.1.4
  # PRIMIO_ADDED: purchases_flutter — RevenueCat SDK for in-app subscriptions and entitlement management
  purchases_flutter: ^8.11.0
  # PRIMIO_ADDED: google_sign_in — Google OAuth login on Android, iOS, and Web
  google_sign_in: ^6.2.2
  # PRIMIO_ADDED: flutter_facebook_auth — Facebook OAuth login on Android and iOS
  flutter_facebook_auth: ^7.1.1
  # PRIMIO_ADDED: sign_in_with_apple — Apple Sign-In on iOS and macOS (required for App Store)
  sign_in_with_apple: ^6.1.3
  # PRIMIO_ADDED: permission_handler — runtime location permission requests on Android and iOS
  permission_handler: ^11.3.1
  # PRIMIO_ADDED: geolocator — GPS coordinate retrieval for distance-based event sorting and radius filtering
  geolocator: ^13.0.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  # --- PRIMIO_ADDITIONS END ---

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4

flutter:
  assets:
    - assets/icons/

  uses-material-design: true
