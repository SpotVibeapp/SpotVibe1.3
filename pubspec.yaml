name: spotvibe_app
description: SpotVibe — local events discovery app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.6
  dio: ^5.8.0
  provider: ^6.1.1

  # OS integration / UX helpers
  url_launcher: ^6.3.2
  awesome_notifications: ^0.10.1

  # Data persistence
  shared_preferences: ^2.5.3

  # Navigation
  go_router: ^14.1.4

  # UI
  google_fonts: ^6.3.2
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  crypto: ^3.0.6

  # Calendar / maps / location
  add_2_calendar: ^3.0.1
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.4.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Deep links / sharing
  app_links: ^6.3.4
  share_plus: ^10.1.4

  # Subscriptions
  purchases_flutter: ^8.11.0

  # Social sign-in (buttons hidden until each provider is configured —
  # see lib/config/app_config.dart)
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  sign_in_with_apple: ^6.1.3

  # Permissions
  permission_handler: ^11.3.1

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4

flutter:
  assets:
    - assets/icons/

  uses-material-design: true
